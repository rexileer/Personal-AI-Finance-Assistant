services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  bot:
    build: .
    command: python manage.py runbot
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_assistant}
      POSTGRES_USER: ${DB_USER:-finance_assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
